[package]
name = "camoufox"
version = "0.1.0"
edition = "2021"
description = "Pure Rust client for Camoufox browser via the Juggler protocol"
license = "MIT"
rust-version = "1.70"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
libc = "0.2.182"

[features]
default = []
