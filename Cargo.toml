[package]
name = "camoufox"
version = "0.1.0"
edition = "2021"
description = "Pure Rust client for Camoufox browser via the Juggler protocol"
license = "MIT"
repository = "https://github.com/9prodhi/camoufox-rs"
rust-version = "1.70"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
libc = "0.2.182"
tempfile = "3"
tiny_http = "0.12"

[[example]]
name = "web_browse"

[features]
default = []
cli = ["clap", "env_logger", "tempfile"]

[[bin]]
name = "camoufox"
path = "src/bin/camoufox.rs"
required-features = ["cli"]
