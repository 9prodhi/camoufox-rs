<!doctype html>
<html><body>
<button id="alert" onclick="alert('Hello'); document.body.dataset.result='alert'">Alert</button>
<button id="confirm" onclick="document.body.dataset.result=String(confirm('Delete?'))">Confirm</button>
<button id="prompt" onclick="document.body.dataset.result=String(prompt('Name?', 'default'))">Prompt</button>
</body></html>
